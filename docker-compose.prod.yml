# Production stack. Run on the server with:
#   docker compose -f docker-compose.prod.yml up -d --build
# The app listens on 127.0.0.1:8081 only; the server's web server (Apache/Nginx)
# proxies https://nbyadvocates.com to it. MySQL is not exposed outside Docker.
services:
  app:
    build: .
    image: nbyadvocates-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-nbyadvocates}
      DB_USERNAME: ${DB_USERNAME:-nby}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - appstorage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nbyadvocates}
      MYSQL_USER: ${DB_USERNAME:-nby}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  appstorage:
